name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"
  # Manual build on any branch (never publishes to PyPI)
  workflow_dispatch:

# Cancel superseded PR builds; never cancel a master build that may be publishing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build configuration
  WORKING_DIRECTORY: "dlib"
  BUILD_COMMIT: "v20.0.1"
  DLIB_BIN_VERSION: "20.0.1.post1"
  CIBUILDWHEEL_VERSION: "4.2.1"

  # Python requirements
  CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"

jobs:
  # Build wheels for all platforms, one job per platform building every Python version
  build_wheels:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - { platform: "manylinux_x86_64", os: "ubuntu-latest" }
          - { platform: "musllinux_x86_64", os: "ubuntu-latest" }

          # Linux aarch64 (native ARM runners)
          - { platform: "manylinux_aarch64", os: "ubuntu-24.04-arm" }
          - { platform: "musllinux_aarch64", os: "ubuntu-24.04-arm" }

          # macOS arm64
          - { platform: "macosx_arm64", os: "macos-14" }

          # Windows AMD64
          - { platform: "win_amd64", os: "windows-latest" }

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          submodules: true

      - name: Checkout dlib at specific version
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          git fetch --all
          git checkout $BUILD_COMMIT

      - name: Patch dlib configuration
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          # Update package name to dlib-bin
          sed -i'' -e "s/name='dlib'/name='dlib-bin'/" setup.py

          # Set explicit version
          sed -i'' -e "s/version=read_version_from_cmakelists('dlib\/CMakeLists.txt')/version='$DLIB_BIN_VERSION'/" setup.py

          # Update repository URL
          sed -i'' -e "s/url='https:\/\/github\.com\/davisking\/dlib'/url='https:\/\/github\.com\/alesanfra\/dlib-wheels'/" setup.py

          # Disable GUI support
          sed -i'' -e "s/_cmake_extra_options = \[\]/_cmake_extra_options = \['-DDLIB_NO_GUI_SUPPORT=ON'\]/" setup.py

          # Add CMake build requirement
          sed -i'' -e "s/requires = \[\"setuptools\", \"wheel\"\]/requires = \[\"setuptools\", \"wheel\", \"cmake>=3.31.0\"\]/" pyproject.toml

      # ccache shares compiled objects between Python versions and between runs.
      # Not used on Windows: setup.py uses the Visual Studio generator, which ignores compiler launchers.
      - name: Restore ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ env.BUILD_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ env.BUILD_COMMIT }}-
            ccache-${{ matrix.platform }}-

      - name: Install ccache
        if: runner.os == 'macOS'
        run: brew install ccache

      # Note: version must match CIBUILDWHEEL_VERSION env var
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: ${{ env.WORKING_DIRECTORY }}
        env:
          CIBW_BUILD: cp3*-${{ matrix.platform }}
          CIBW_SKIP: "cp3*t-*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL_LINUX: |
            if command -v apk; then apk add ccache; else dnf install -y epel-release && dnf install -y ccache; fi
          CIBW_BEFORE_BUILD: pip install cmake
          # The workspace is mounted at /host inside the Linux build container
          CIBW_ENVIRONMENT_LINUX: >-
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            CCACHE_DIR=/host${{ github.workspace }}/.ccache
            CCACHE_BASEDIR=/project
            CCACHE_COMPRESS=1
            CCACHE_MAXSIZE=1G
          CIBW_ENVIRONMENT_MACOS: >-
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            CCACHE_DIR=${{ github.workspace }}/.ccache
            CCACHE_BASEDIR=${{ github.workspace }}
            CCACHE_MAXSIZE=1G
          CIBW_TEST_COMMAND: python -c "import dlib"
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Show ccache stats
        if: runner.os == 'macOS'
        run: ccache --show-stats

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: wheelhouse/*.whl

  # Upload to PyPI on master branch
  upload_pypi:
    name: Publish to PyPI
    needs: [build_wheels]
    runs-on: ubuntu-latest

    # Only upload on master branch pushes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
