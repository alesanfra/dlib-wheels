name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  # Build configuration
  WORKING_DIRECTORY: "dlib"
  BUILD_COMMIT: "v20.0"
  DLIB_BIN_VERSION: "20.0.0"
  CIBUILDWHEEL_VERSION: "3.2.1"
  
  # Python requirements
  CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11"

jobs:
  # Generate dynamic build matrix for all platforms
  build_wheels_matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    
    outputs:
      include: ${{ steps.set-matrix.outputs.include }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          
      - name: Install cibuildwheel
        run: pip install cibuildwheel=="${{ env.CIBUILDWHEEL_VERSION }}"

      - name: Generate build matrix
        id: set-matrix
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_SKIP: "pp* *t-win*"  # Skip PyPy and freethreading on Windows
        run: |
          MATRIX_INCLUDE=$(
            {
              cibuildwheel --print-build-identifiers --platform linux --arch x86_64,aarch64 | \
                jq -nRc '{"only": inputs, "os": "ubuntu-latest", "deployment_target": ""}' \
              && cibuildwheel --print-build-identifiers --platform macos --arch arm64 | \
                jq -nRc '{"only": inputs, "os": "macos-14", "deployment_target": "14"}' \
              && cibuildwheel --print-build-identifiers --platform windows --arch AMD64 | \
                jq -nRc '{"only": inputs, "os": "windows-latest", "deployment_target": ""}'
            } | jq -sc
          )
          echo "include=$MATRIX_INCLUDE" >> $GITHUB_OUTPUT

  # Build wheels for all platforms
  build_wheels:
    name: Build ${{ matrix.only }}
    needs: build_wheels_matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build_wheels_matrix.outputs.include) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          submodules: true

      - name: Checkout dlib at specific version
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          git fetch --all
          git checkout $BUILD_COMMIT

      - name: Patch dlib configuration
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          # Update package name to dlib-bin
          sed -i'' -e "s/name='dlib'/name='dlib-bin'/" setup.py
          
          # Set explicit version
          sed -i'' -e "s/version=read_version_from_cmakelists('dlib\/CMakeLists.txt')/version='$DLIB_BIN_VERSION'/" setup.py
          
          # Update repository URL
          sed -i'' -e "s/url='https:\/\/github\.com\/davisking\/dlib'/url='https:\/\/github\.com\/alesanfra\/dlib-wheels'/" setup.py
          
          # Disable GUI support
          sed -i'' -e "s/_cmake_extra_options = \[\]/_cmake_extra_options = \['-DDLIB_NO_GUI_SUPPORT=ON'\]/" setup.py
          
          # Add CMake build requirement
          sed -i'' -e "s/requires = \[\"setuptools\", \"wheel\"\]/requires = \[\"setuptools\", \"wheel\", \"cmake>=3.31.0\"\]/" pyproject.toml
          
      - name: Set up QEMU for cross-compilation
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      # Note: version must match CIBUILDWHEEL_VERSION env var
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          only: ${{ matrix.only }}
          package-dir: ${{ env.WORKING_DIRECTORY }}
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_BUILD: pip install cmake
          CIBW_TEST_COMMAND: python -c "import dlib"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.only }}
          path: wheelhouse/*.whl
 
  # Upload to PyPI on master branch
  upload_pypi:
    name: Publish to PyPI
    needs: [build_wheels]
    runs-on: ubuntu-latest
    
    # Only upload on master branch pushes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    permissions:
      id-token: write  # Required for trusted publishing
    
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
